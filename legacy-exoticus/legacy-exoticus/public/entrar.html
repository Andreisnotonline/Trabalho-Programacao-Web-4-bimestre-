<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Legacy Exoticus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a class="logo" href="index.html" data-img="logo" data-alt="Legacy Exoticus" aria-label="Legacy Exoticus">
        <span class="logo-word">LEGACY</span>
        <span class="logo-sub">EXOTICUS</span>
      </a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="servicos.html">Serviços</a>
        <a href="agendamento.html">Agendamento</a>
        <a href="loja.html">Loja</a>
        <a href="animais.html">Nossos Animais</a>
        <a href="sobre.html">Sobre Nós</a>
        <a class="btn btn-nav" href="cadastro.html">Cadastre-se</a>
      </nav>
    </header>
    <main>

      <section class="two-col" style="grid-template-columns:1.2fr 1fr;align-items:stretch">
        <div class="login-visual">
          <div class="ph " data-img="home-destaque" data-alt="Espécies fascinantes"><span class="ph-label">foto</span><span class="tag">Espécies fascinantes</span></div>
          <h2>Bem-vindo <span class="gold">de volta</span></h2>
          <p>Entre para agendar consultas, acompanhar seus animais e acessar a loja.</p>
        </div>
        <div class="card form-card">
          <h2>Entrar</h2>
          <p class="sub">Acesse sua conta Legacy Exoticus</p>
          <form id="form-login" novalidate>
            <div class="field" style="margin-top:34px"><label for="email">E-mail</label><input type="email" id="email" name="email" placeholder="voce@email.com" autocomplete="email"></div>
            <div class="field"><label for="senha">Senha</label><input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password"></div>
            <div class="check check-split">
              <label for="lembrar"><input type="checkbox" id="lembrar" name="lembrar">Lembrar de mim</label>
              <a href="#">Esqueci minha senha</a>
            </div>
            <button type="submit" class="btn btn-submit">Entrar</button>
            <p class="form-msg" role="alert"></p>
          </form>
          <p class="form-foot">Ainda não tem conta?<br><a class="btn btn-outline btn-block" href="cadastro.html">Cadastre-se</a></p>
        </div>
      </section>
    </main>
  </div>
  <script src="main.js"></script>
</body>
</html>
